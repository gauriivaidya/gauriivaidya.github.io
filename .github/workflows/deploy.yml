name: Deploy to GitHub Pages
# On every push to main: build the CV (cv/cv.tex.j2 + content/ -> public/cv.pdf, with privacy checks),
# then the website (content/ -> src/data/*.json -> prerendered pages), and deploy both.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: npm ci
      # Small, frozen TeX Live 2025 (~180 MB) with only the CV's packages. Installed once, then restored from cache.
      - name: Restore TeX Live from cache
        id: texlive
        uses: actions/cache@v4
        with:
          path: ~/texlive
          key: texlive-2025-${{ runner.os }}-${{ hashFiles('cv/texlive-packages.txt', 'scripts/install-texlive.sh') }}
      - name: Install TeX Live (only when not cached)
        if: steps.texlive.outputs.cache-hit != 'true'
        run: bash scripts/install-texlive.sh "$HOME/texlive"
      - run: echo "$HOME/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
      - name: pdftotext / pdfinfo for the CV privacy checks
        run: command -v pdftotext >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
      - name: Build CV (fails on phone numbers, gmail.com or a Projects heading)
        run: npm run build:cv
      - name: Build website
        run: npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
