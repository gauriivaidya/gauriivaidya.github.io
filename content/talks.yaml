# Talks & Events: one entry per talk, workshop, presentation or event. Newest first.
# Feeds the Talks & Events page and, with a `cv:` line, the "Invited Talks" or "Workshops" section of the CV.
# (Awards live in awards.yaml; they also show on the Talks & Events page.)
#
# Example entry (copy, paste at the top, edit; only `title`, `type` and `date` are required):
#
# - title: Machine Learning for Kidney Disease Surveillance       # Title Case
#   type: Invited Talks            # Invited Talks | Conference Presentations | Workshops | Panels | Media Appearances | Other Events
#   date: Mar 2027                 # Mon YYYY, D Mon YYYY, YYYY or YYYY–YYYY; the year is taken from it
#   host: Royal College of Surgeons in Ireland
#   location: Dublin, Ireland      # City, Country (or just Country)
#   role: Invited Speaker
#   description: Co-presented with Prof Austin Stack.            # a full sentence; write "Prof" and "Dr" without a full stop
#   link: { label: Slides, url: "https://example.org/slides.pdf" }   # optional, real URLs only
#   cv: Invited Talks              # put it on the CV in this section (Invited Talks | Workshops); leave out to keep it off the CV

