# Teaching: one entry per module (or teaching role). Newest first.
# Feeds the Teaching page (grouped by the latest year in `years`) and the "Teaching Experience" section of the CV
# (grouped by role: Instructor, Teaching Assistant, Moderator…).
#
# Example entry (only `name`, `years`, `institution` and `role` are required):
#
# - code: CS5001                   # optional module code (shown as the badge)
#   name: Machine Learning for Health                     # Title Case
#   years: Spring 2027             # terms, e.g. "Fall 2025, Fall 2026"
#   institution: University of Limerick
#   location: Ireland              # City, Country (or just Country)
#   role: Instructor               # Instructor | Teaching Assistant | Moderator ...
#   level: Graduate                # optional: Graduate | Undergraduate
#   description: Sole responsibility for the module; 40 students (Spring 2027).   # a full sentence
#   resources:                     # optional, real URLs only
#     - { label: Handbook, url: "https://example.org/handbook" }
#   cv: false                      # optional: keep it off the CV

